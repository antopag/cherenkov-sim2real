# @package _global_
# S0 scenario: MMD-linear with lightgbm classifier.

experiment_name: s0_mmd_linear_lgbm

seed: 42

scenario:
  name: S0
  data_dir: data/raw/cta_prod5/dl1
  perturbation_intensity: 1.0
  split_ratios: [0.70, 0.15, 0.15]
  subsample: null

method:
  name: mmd_linear
  lambda_reg: 1.0e-3

classifier: lightgbm
classifier_params:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05

model:
  name: logistic_regression

output_dir: results/s0_mmd_linear_lgbm

hydra:
  run:
    dir: results//
