# @package _global_
# S0 scenario: MMD-rbf with extratrees classifier.

experiment_name: s0_mmd_rbf_et

seed: 42

scenario:
  name: S0
  data_dir: data/raw/cta_prod5/dl1
  perturbation_intensity: 1.0
  split_ratios: [0.70, 0.15, 0.15]
  subsample: null

method:
  name: mmd_rbf
  lambda_reg: 1.0e-3
  max_iter: 100

classifier: extratrees
classifier_params:
  n_estimators: 100
  criterion: entropy

model:
  name: logistic_regression

output_dir: results/s0_mmd_rbf_et

hydra:
  run:
    dir: results//
