# @package _global_
# S0 scenario: mean matching baseline on Prod5 baseline vs perturbed.

experiment_name: s0_mean_matching

seed: 42

scenario:
  name: S0
  data_dir: data/raw/cta_prod5/dl1
  perturbation_intensity: 1.0
  split_ratios: [0.70, 0.15, 0.15]
  subsample: null

method:
  name: mean_matching

model:
  name: logistic_regression

output_dir: results/s0_mean_matching

hydra:
  run:
    dir: results/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
