# @package _global_
# S0 scenario: CORAL domain adaptation on Prod5 baseline vs perturbed.

experiment_name: s0_coral

seed: 42

scenario:
  name: S0
  data_dir: data/raw/cta_prod5/dl1
  perturbation_intensity: 1.0
  split_ratios: [0.70, 0.15, 0.15]
  subsample: null

method:
  name: coral
  lambda_reg: 1.0e-3

model:
  name: logistic_regression

output_dir: results/s0_coral

hydra:
  run:
    dir: results/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
