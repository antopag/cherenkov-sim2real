# @package _global_
# S0 scenario: source-only baseline with ExtraTrees classifier.

experiment_name: s0_srconly_et

seed: 42

scenario:
  name: S0
  data_dir: data/raw/cta_prod5/dl1
  perturbation_intensity: 1.0
  split_ratios: [0.70, 0.15, 0.15]
  subsample: null

method:
  name: srconly

classifier: extratrees
classifier_params:
  n_estimators: 100
  criterion: entropy

model:
  name: logistic_regression

output_dir: results/s0_srconly_et

hydra:
  run:
    dir: results/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
